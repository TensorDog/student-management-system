spring.config.import: "optional:nacos:"

server:
  port: 8082

spring:
  application:
    name: class-service
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:student_management;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  cloud:
    nacos:
      config:
        import-check:
          enabled: false

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.student.common.entity
  configuration:
    map-underscore-to-camel-case: true
    use-generated-keys: true
    default-fetch-size: 100
    default-statement-timeout: 30

# 日志配置
logging:
  level:
    com.student.classservice: DEBUG
    com.student.common: DEBUG
    org.springframework.cloud: DEBUG
    org.mybatis: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always