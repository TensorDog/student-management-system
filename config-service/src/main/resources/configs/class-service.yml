# Class Service 配置文件
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/student_management?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        namespace: student-management
        group: DEFAULT_GROUP

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.student.common.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.student.classservice: DEBUG
    com.student.classservice.mapper: DEBUG